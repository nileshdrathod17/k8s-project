---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nilesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nilesh
  template:
    metadata:
      labels:
        app: nilesh
    spec:
      containers:
      - name: nilesh
        image: nileshrathod17/dockerproject:latest
        ports:
        - containerPort: 3000   # Use port 3000

---
apiVersion: v1
kind: Service
metadata:
  name: nilesh-service
spec:
  selector:
    app: nilesh
  ports:
  - protocol: TCP
    port: 80                 # Expose port 80
    targetPort: 3000
  type: LoadBalancer
